name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    name: Integration, build + end-to-end
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: sifra, POSTGRES_PASSWORD: sifra, POSTGRES_DB: sifra }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sifra" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://sifra:sifra@localhost:5432/sifra
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0123456789
      DATA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CRON_SECRET: ci-cron
      ALLOW_SIMULATED_PAYMENTS: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed:demo
      - run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgres://sifra:sifra@localhost:5432/sifra_test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
